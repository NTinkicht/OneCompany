name: L5 Finalize Once

on:
  push:
    paths:
      - '.github/workflows/l5-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/l5/claude-hostile-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: l5/claude-hostile-controller
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply final L5 hardening
        run: python scripts/l5_finalize_patch.py
      - name: Run focused L5 validation
        run: |
          python scripts/l5_state_machine.py --selftest
          python scripts/l5_kernel.py
          python -m unittest discover -s tests -p 'test_l5_*.py'
          python scripts/l5_hostile_sim.py
          python scripts/l5_intent_hostile_sim.py
      - name: Commit hardening
        run: |
          git config user.name 'l5-finalize[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/l5-hostile-controller-ci.yml scripts/l5_state_machine.py scripts/l5_kernel.py scripts/l5_ledger.py scripts/l5_ledger_store.py scripts/l5_controller.py scripts/l5_intent_hostile_sim.py tests/test_l5_controller.py tests/test_l5_ledger.py tests/test_l5_ledger_store.py
          git commit -m 'fix(l5): close final coordination safety gaps'
          git push origin HEAD:l5/claude-hostile-controller
