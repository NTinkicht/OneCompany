name: L5 Finalize Once

on:
  push:
    paths:
      - '.github/workflows/l5-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/l5/claude-hostile-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: l5/claude-hostile-controller
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply final L5 hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Keep all L5 authorization/write-boundary changes inside hostile CI.
          Path('.github/workflows/l5-hostile-controller-ci.yml').write_text('''name: L5 Hostile Controller Candidate CI

