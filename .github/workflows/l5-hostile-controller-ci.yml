name: L5 Hostile Controller Candidate CI

on:
  pull_request:
    paths:
      - 'scripts/l5_*.py'
      - 'tests/test_l5_*.py'
      - '.onecompany/selftest/test_l5_activation.py'
      - '.l5/trust-policy.json'
      - '.l5/control-plane.json'
      - 'docs/L5-STATE-MACHINE-V1.md'
      - 'docs/L5-INTENT-RESTRAINT-V1.1.md'
      - 'docs/L5-POST-CLAUDE-CUTOVER.md'
      - '.github/workflows/l5-hostile-controller-ci.yml'

permissions:
  contents: read

concurrency:
  group: l5-hostile-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hostile-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Kernel selftest
        run: python scripts/l5_kernel.py
      - name: Claude L5 unit, ledger, runner, intent, trust, shadow and liveness tests
        run: python -m unittest discover -s tests -p "test_l5_*.py"
      - name: Activation and guarded-write trust-boundary tests
        run: python -m unittest .onecompany/selftest/test_l5_activation.py
      - name: S1-S30 hostile interleavings
        run: python scripts/l5_hostile_sim.py
      - name: S31-S40 intent and restraint hostile traces
        run: python scripts/l5_intent_hostile_sim.py
      - name: A1-A12 randomized API-level hostile scheduler traces
        run: python scripts/l5_api_hostile_sim.py --rounds 1000
