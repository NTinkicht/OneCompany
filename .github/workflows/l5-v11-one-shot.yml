name: L5 v1.1 One-Shot Hardening

on:
  push:
    branches:
      - l5/claude-hostile-controller
    paths:
      - scripts/_apply_l5_v11_once.py
      - .github/workflows/l5-v11-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: l5/claude-hostile-controller
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply deterministic L5.1 patch
        run: python scripts/_apply_l5_v11_once.py
      - name: Format candidate workflow when Prettier is available
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            if [ -x node_modules/.bin/prettier ]; then
              node_modules/.bin/prettier --write .github/workflows/l5-hostile-controller-ci.yml
            fi
          fi
      - name: Validate Python L5 suite
        run: python -m unittest discover -s tests -p 'test_l5_*.py'
      - name: Run S1-S30 hostile certification
        run: python scripts/l5_hostile_sim.py
      - name: Run S31-S40 intent/restraint certification
        run: python scripts/l5_intent_hostile_sim.py
      - name: Commit hardened controller and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'l5-human-authorized-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git rm scripts/_apply_l5_v11_once.py .github/workflows/l5-v11-one-shot.yml
          git add -A
          git commit -m 'feat(l5): add Engineering Intent and Restraint gate'
          git push origin HEAD:l5/claude-hostile-controller
