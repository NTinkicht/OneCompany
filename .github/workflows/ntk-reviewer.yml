name: ntk-reviewer

# One independent exact-head reviewer for OneCompany, Tabibi and veritas-atlas.
# Runs only from main, only inside the `reviewer` environment (deployment
# branch policy: main), and does nothing until the owner sets the REPOSITORY
# variable REVIEWER_ENABLED=true. REVIEWER_MODE=comment is shadow mode;
# REVIEWER_MODE=approve lets it APPROVE / REQUEST_CHANGES ordinary PRs.
# It never approves control-plane paths (.github/**, CODEOWNERS, stop/budget).
# Code: .github/ntk-reviewer/review.py  Tests: .onecompany/selftest/test_ntk_reviewer.py

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: review one PR only, e.g. Tabibi#614'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ntk-reviewer
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main' && vars.REVIEWER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: reviewer
    steps:
      # actions/checkout v7.0.1, immutable pin (same as onecompany-validate.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # actions/setup-python v7.0.0, immutable pin.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned Mistral Vibe
        run: python -I -m pip install --disable-pip-version-check 'mistral-vibe==2.25.3'

      # actions/create-github-app-token v3.1.1, immutable pin.
      - name: Mint short-lived reviewer App token
        id: app
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_KEY }}
          owner: NTinkicht
          repositories: OneCompany,Tabibi,veritas-atlas
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          permission-metadata: read

      - name: Review open PRs
        env:
          REVIEWER_TOKEN: ${{ steps.app.outputs.token }}
          REVIEWER_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          REVIEWER_MODE: ${{ vars.REVIEWER_MODE }}
          REVIEW_ONLY: ${{ inputs.only }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PAYG_DISABLED_CONFIRMED: ${{ vars.ONECOMPANY_MISTRAL_PAYG_DISABLED_CONFIRMED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -I .github/ntk-reviewer/review.py
