name: OneCompany Copilot Readonly Worker
run-name: OneCompany Copilot ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Canonical OneCompany dispatch identity
        required: true
        type: string
      work_unit:
        description: Work Unit being analyzed
        required: true
        type: string
      capability:
        description: Read-only capability
        required: true
        type: choice
        options:
          - repository_intelligence
          - test_design
          - failure_analysis

permissions:
  contents: read
  actions: read
  copilot-requests: write

concurrency:
  group: onecompany-copilot-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  readonly-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Validate zero-spend policy and bounded inputs
        id: prepare
        env:
          INPUT_DISPATCH_ID: ${{ inputs.dispatch_id }}
          INPUT_WORK_UNIT: ${{ inputs.work_unit }}
          INPUT_CAPABILITY: ${{ inputs.capability }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          budget = json.loads(Path('.onecompany/budget.json').read_text(encoding='utf-8'))
          ai = budget.get('ai', {})
          allowed = set(budget.get('cost_classes', {}).get('allowed', []))
          required_zero = {
              'additional_monthly_spend_cap': 0,
              'allow_paid_fallback': False,
              'allow_overage': False,
              'allow_auto_topup': False,
              'allow_new_paid_vendor': False,
          }
          for key, expected in required_zero.items():
              if ai.get(key) != expected:
                  raise SystemExit(f'zero-spend policy mismatch: {key}')
          if 'INCLUDED_SUBSCRIPTION' not in allowed:
              raise SystemExit('INCLUDED_SUBSCRIPTION is not budget-allowed')

          dispatch_id = os.environ.get('INPUT_DISPATCH_ID', '')
          work_unit = os.environ.get('INPUT_WORK_UNIT', '')
          capability = os.environ.get('INPUT_CAPABILITY', '')
          safe_token = re.compile(r'^[A-Za-z0-9._:-]{1,160}$')
          if not safe_token.fullmatch(dispatch_id):
              raise SystemExit('invalid dispatch_id')
          if not safe_token.fullmatch(work_unit):
              raise SystemExit('invalid work_unit')
          allowed_caps = {'repository_intelligence', 'test_design', 'failure_analysis'}
          if capability not in allowed_caps:
              raise SystemExit('capability is not read-only allowlisted')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'dispatch_id={dispatch_id}\n')
              out.write(f'work_unit={work_unit}\n')
              out.write(f'capability={capability}\n')
          PY

      - name: Refuse duplicate workflow-dispatch AI invocation
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TITLE: OneCompany Copilot ${{ steps.prepare.outputs.dispatch_id }}
        run: |
          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/workflows/onecompany-copilot-readonly.yml/runs?per_page=100" > "${RUNNER_TEMP}/copilot-runs.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pages = json.loads((Path(os.environ['RUNNER_TEMP']) / 'copilot-runs.json').read_text(encoding='utf-8'))
          if not isinstance(pages, list):
              raise SystemExit('workflow run pagination evidence is not a list')
          workflow_runs = []
          for page in pages:
              if not isinstance(page, dict) or not isinstance(page.get('workflow_runs'), list):
                  raise SystemExit('workflow run pagination page is malformed')
              workflow_runs.extend(page['workflow_runs'])

          current = int(os.environ['GITHUB_RUN_ID'])
          title = os.environ['EXPECTED_TITLE']
          matching = [
              item
              for item in workflow_runs
              if item.get('event') == 'workflow_dispatch'
              and item.get('display_title') == title
              and isinstance(item.get('created_at'), str)
              and int(item.get('id', 0)) > 0
          ]
          if not any(int(item['id']) == current for item in matching):
              raise SystemExit('current workflow run is missing from duplicate-election evidence')
          canonical = min(
              matching,
              key=lambda item: (item['created_at'], int(item['id'])),
          )
          duplicate = int(canonical['id']) != current
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"duplicate={'true' if duplicate else 'false'}\n")
          PY

      - name: Set up pinned Copilot CLI runtime
        if: steps.dedupe.outputs.duplicate != 'true'
        env:
          COPILOT_SCOPE: '@github'
          COPILOT_PACKAGE: copilot
          COPILOT_VERSION: '1.0.83'
        run: npm install --global "${COPILOT_SCOPE}/${COPILOT_PACKAGE}@${COPILOT_VERSION}"

      - name: Record Copilot CLI version
        if: steps.dedupe.outputs.duplicate != 'true'
        run: copilot --version

      - name: Run bounded read-only Copilot analysis
        if: steps.dedupe.outputs.duplicate != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS: 'false'
          GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: 'false'
          GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: 'false'
          DISPATCH_ID: ${{ steps.prepare.outputs.dispatch_id }}
          WORK_UNIT: ${{ steps.prepare.outputs.work_unit }}
          CAPABILITY: ${{ steps.prepare.outputs.capability }}
        run: |
          set -euo pipefail
          PROMPT="Perform a read-only repository analysis for OneCompany dispatch ${DISPATCH_ID}, work unit ${WORK_UNIT}, capability ${CAPABILITY}. Inspect repository files only. Do not modify files, execute shell commands, access network resources, use MCP servers or subagents, create branches/issues/pull requests, or change Git state. Return concise findings, evidence paths, and suggested next steps."
          copilot -p "$PROMPT" \
            --model=auto \
            --max-ai-credits=30 \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --no-ask-user \
            --no-auto-update \
            --no-custom-instructions \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-color \
            | tee "${RUNNER_TEMP}/copilot-output.txt"

      - name: Publish bounded evidence summary
        if: always()
        env:
          DUPLICATE: ${{ steps.dedupe.outputs.duplicate }}
        run: |
          {
            echo '## OneCompany Copilot read-only worker'
            echo
            echo "- Dispatch: \`${{ steps.prepare.outputs.dispatch_id }}\`"
            echo "- Work Unit: \`${{ steps.prepare.outputs.work_unit }}\`"
            echo "- Capability: \`${{ steps.prepare.outputs.capability }}\`"
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Exact checkout head: \`${GITHUB_SHA}\`"
            echo "- Duplicate AI invocation skipped: \`${DUPLICATE:-false}\`"
            echo '- Tool surface: `view,grep,glob` only; read permission only'
            echo '- Per-response AI credit cap: `30` (minimum accepted by Copilot CLI 1.0.83)'
          } >> "${GITHUB_STEP_SUMMARY}"
