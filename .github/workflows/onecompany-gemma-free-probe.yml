# Source-only hosted Gemma free-model canary, NOT unattended engineering authority.
name: OneCompany Gemma Free Synthetic Probe

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Send one public synthetic coding task to OpenRouter :free model"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gemma-synthetic:
    if: github.actor == 'NTinkicht'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Offline security and quota-failure regression tests
        run: python -m unittest discover -s .onecompany/selftest -p 'test_gemma_free_probe.py'

      - name: Zero-additional-spend preflight (never calls provider)
        run: python scripts/gemma_free_probe.py

      - name: One synthetic free API request ONLY when explicitly selected
        if: inputs.live == true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/gemma_free_probe.py --live
