name: OneCompany Merge Authority Lane CI

on:
  pull_request:
    paths:
      - 'scripts/merge.py'
      - 'scripts/merge_lane.py'
      - '.onecompany/governance.json'
      - 'tests/test_merge_lane.py'
      - '.github/workflows/onecompany-merge-lane-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lanes:
    name: Routine vs governed lane regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -I -m unittest discover -s tests -p 'test_merge_lane.py' -v
      - run: python -I -m py_compile scripts/merge.py scripts/merge_lane.py
