# Source-only reviewer pilot: not a binding merge gate or customer installer component.
name: OneCompany Mistral Exact-Head Advisory Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  mistral-vibe:
    if: >-
      github.event.issue.number == 130 &&
      github.event.issue.pull_request == null &&
      github.actor == 'NTinkicht' &&
      contains(github.event.comment.body, '@mistral-vibe') &&
      contains(github.event.comment.body, 'MISTRAL_REVIEW_V1')
    runs-on: ubuntu-latest
    env:
      ONECOMPANY_LEDGER_RULES_FILE: /tmp/onecompany-mistral-trusted/ledger-workflow.yml
    timeout-minutes: 15
    concurrency:
      group: onecompany-mistral-advisory-review
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve trusted canonical exact-head review assignment
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/mistral_cloud_review.py /tmp/onecompany-mistral-review-trusted.py
          cp scripts/mistral_review_result.py /tmp/onecompany-mistral-result-trusted.py
          cp scripts/mistral_review_packet.py /tmp/onecompany-mistral-packet-trusted.py
          cp .onecompany/budget.json /tmp/onecompany-budget-trusted.json
          mkdir -m 700 -p /tmp/onecompany-mistral-trusted
          cp AGENTS.md /tmp/onecompany-mistral-trusted/AGENTS.md
          cp docs/CLOUD-AGENT-QUALIFICATION.md /tmp/onecompany-mistral-trusted/CLOUD-AGENT-QUALIFICATION.md
          cp .github/workflows/onecompany-ledger-read-smoke.yml /tmp/onecompany-mistral-trusted/ledger-workflow.yml
          python -I /tmp/onecompany-mistral-review-trusted.py prepare

      - name: Checkout the validated same-repository PR head
        if: steps.target.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck exact PR head and create a bounded read-only diff
        id: evidence
        if: steps.target.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_BASE: ${{ steps.target.outputs.base }}
        shell: bash
        run: python -I /tmp/onecompany-mistral-review-trusted.py evidence

      - name: Build isolated bounded review-data stage
        id: stage
        if: steps.evidence.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_BASE: ${{ steps.target.outputs.base }}
        shell: bash
        run: python -I /tmp/onecompany-mistral-review-trusted.py stage

      - name: Preflight included-capacity guard
        if: steps.stage.outputs.ready == 'true'
        id: preflight
        env:
          PAYG_DISABLED_CONFIRMED: ${{ vars.ONECOMPANY_MISTRAL_PAYG_DISABLED_CONFIRMED }}
          PROVIDER_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # The owner-set guard is never sufficient without zero-spend machine policy.
          if ! python -I - <<'PY'
          import json
          from pathlib import Path
          budget = json.loads(Path("/tmp/onecompany-budget-trusted.json").read_text())
          ai = budget.get("ai", {})
          assert ai.get("additional_monthly_spend_cap") == 0
          assert all(ai.get(k) is False for k in ("allow_paid_fallback", "allow_overage", "allow_auto_topup", "allow_new_paid_vendor"))
          PY
          then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=CONFIG_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=OneCompany zero-additional-spend machine policy not verified" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${PAYG_DISABLED_CONFIRMED:-}" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=CONFIG_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral PAYG-disabled repository guard is not confirmed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${PROVIDER_KEY:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=AUTH_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral credential is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `/api/vibe/whoami` is a non-inference entitlement check. Never print
          # the provider response body or credential.
          set +e
          http_status="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${PROVIDER_KEY}" \
            'https://console.mistral.ai/api/vibe/whoami')"
          curl_code=$?
          set -e

          if [[ "$curl_code" != "0" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=PREFLIGHT_UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral Vibe entitlement could not be verified" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "200" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "status=OK" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "401" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=AUTH_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral credential is not authorized for Vibe Code (HTTP ${http_status})" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "403" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=ENTITLEMENT_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral Vibe entitlement was rejected (HTTP ${http_status})" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "429" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=CAPACITY_DEGRADED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral included capacity is unavailable or exhausted" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=PREFLIGHT_FAILED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral Vibe entitlement check returned HTTP ${http_status}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned Mistral Vibe
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: python -I -m pip install --disable-pip-version-check 'mistral-vibe==2.25.3'

      - name: Run Mistral Vibe in bounded read-only programmatic mode
        if: steps.preflight.outputs.ready == 'true'
        id: actor
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISPATCH_BODY: ${{ github.event.comment.body }}
          VIBE_HOME: /tmp/onecompany-vibe-review-home
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_BASE: ${{ steps.target.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VIBE_HOME"
          cat > "$VIBE_HOME/config.toml" <<'EOF'
          enable_auto_update = false
          enable_notifications = false
          enable_telemetry = false
          enabled_tools = ["re:^(?!)"]
          EOF

          # Trusted source-only parent assembles the exact-head bounded review
          # packet, with NO model-initiated file reading or repeated tool turns.
          # The candidate diff and source are included as untrusted DATA, never
          # executed or interpreted as workflow commands.
          if ! python -I /tmp/onecompany-mistral-packet-trusted.py \
            --stage /tmp/onecompany-mistral-review-stage \
            --trusted /tmp/onecompany-mistral-trusted \
            --pr "$REVIEW_PR" --head "$REVIEW_SHA" --base "$REVIEW_BASE" \
            > /tmp/onecompany-mistral-prompt.txt; then
            echo "exit_code=73" >> "$GITHUB_OUTPUT"
            echo "status=REVIEW_PACKET_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "failure_reason=Bounded trusted one-shot review packet unavailable; no model call" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Mistral documents that --enabled-tools narrows the programmatic
          # toolset and re: uses fullmatch. This impossible name enables NO
          # tools, eliminating repeated reads and token-expensive tool schemas.
          # The parent-supplied packet is the entire permitted review context.
          # Keep the read-only plan agent and the two-turn cumulative guard.
          set +e
          timeout --signal=TERM --kill-after=15s 600s \
            vibe \
              --trust \
              --agent plan \
              --workdir /tmp/onecompany-mistral-review-stage \
              --enabled-tools 're:^(?!)' \
              --max-turns 2 \
              --max-tokens 64000 \
              --output text \
              --prompt "$(cat /tmp/onecompany-mistral-prompt.txt)" \
              > /tmp/onecompany-mistral-output.txt \
              2> /tmp/onecompany-mistral-error.txt
          code=$?
          set -e

          status="OK"
          reason="ready"
          if [[ "$code" == "0" ]] && ! grep -Eq '[^[:space:]]' /tmp/onecompany-mistral-output.txt; then
            code=70
            status="EXECUTION_FAILED"
            reason="Mistral Vibe returned an empty final answer from the isolated review stage"
          elif [[ "$code" == "0" ]] && grep -Eqi '^[[:space:]]*INSUFFICIENT_EVIDENCE[[:space:]]*$' /tmp/onecompany-mistral-output.txt; then
            code=71
            status="INSUFFICIENT_EVIDENCE"
            reason="Mistral explicitly reported insufficient evidence; not a completed advisory review"
          elif [[ "$code" == "0" ]]; then
            # A nonempty model answer is NOT proof of a completed review.
            # Validate strict UTF-8 JSON and detect INSUFFICIENT_EVIDENCE
            # while the raw result is still local and before publication.
            set +e
            python -I /tmp/onecompany-mistral-result-trusted.py \
              "$REVIEW_PR" "$REVIEW_SHA" "$REVIEW_BASE" \
              /tmp/onecompany-mistral-output.txt
            parsed_code=$?
            set -e
            if [[ "$parsed_code" == "71" ]]; then
              code=71
              status="INSUFFICIENT_EVIDENCE"
              reason="Mistral returned a valid JSON insufficient-evidence verdict"
            elif [[ "$parsed_code" != "0" ]]; then
              code=72
              status="RESULT_CONTRACT_INVALID"
              reason="Mistral review is malformed, stale, overbound or not schema-valid"
            fi
          elif [[ "$code" == "124" || "$code" == "137" ]]; then
            status="WAKE_TIMEOUT"
            reason="Mistral Vibe exceeded the 10-minute actor time limit"
          elif [[ "$code" != "0" ]]; then
            if grep -Eqi '<vibe_stop_event>Turn limit of [0-9]+ reached</vibe_stop_event>' /tmp/onecompany-mistral-error.txt; then
              status="TURN_LIMIT_EXCEEDED"
              reason="Mistral Vibe exhausted bounded agent turns without a usable review; no approval evidence"
            elif grep -Eqi '401|unauthori[sz]ed|invalid[^[:alnum:]]*(api[^[:alnum:]]*)?key|authentication' /tmp/onecompany-mistral-error.txt; then
              status="AUTH_BLOCKED"
              reason="Mistral credential was rejected by the Vibe runtime"
            elif grep -Eqi '403|forbidden|entitlement|permission denied' /tmp/onecompany-mistral-error.txt; then
              status="ENTITLEMENT_BLOCKED"
              reason="Mistral Vibe entitlement was rejected by the runtime"
            elif grep -Eqi 'token limit exceeded|context (window|length) exceeded|too many tokens' /tmp/onecompany-mistral-error.txt; then
              status="TOKEN_BUDGET_EXCEEDED"
              reason="Mistral Vibe hit this workflow's configured per-execution token ceiling; NOT proof of exhausted subscription credits, included quota or financial budget; narrow evidence before retry"
            elif grep -Eqi '429|rate.?limit|quota|usage[^[:alnum:]]*limit|capacity' /tmp/onecompany-mistral-error.txt; then
              status="CAPACITY_DEGRADED"
              reason="Mistral included capacity is unavailable or exhausted"
            elif grep -Eqi 'trust|trusted folder|workspace' /tmp/onecompany-mistral-error.txt; then
              status="WORKSPACE_TRUST_FAILED"
              reason="Mistral Vibe workspace trust initialization failed"
            elif grep -Eqi 'no such option|unknown option|unrecognized|usage:' /tmp/onecompany-mistral-error.txt; then
              status="CLI_INCOMPATIBLE"
              reason="Mistral Vibe CLI invocation is incompatible with the pinned version"
            else
              status="EXECUTION_FAILED"
              reason="Mistral Vibe runtime failed with an unclassified nonzero exit"
            fi
          fi

          if [[ "$code" != "0" ]] && [[ -s /tmp/onecompany-mistral-error.txt ]]; then
            # Job-log-only diagnostics. Scrub the literal credential plus common
            # bearer/key renderings before the excerpt can reach the Actions log;
            # it is never posted to the public issue comment.
            python -I - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('/tmp/onecompany-mistral-error.txt')
          target = Path('/tmp/onecompany-mistral-error-scrubbed.txt')
          text = source.read_text(encoding='utf-8', errors='replace')
          secret = os.environ.get('MISTRAL_API_KEY', '')
          if secret:
              text = text.replace(secret, '[REDACTED]')
          text = re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)(mistral_api_key\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
          lines = text.splitlines()
          target.write_text('\n'.join(lines[-20:]) + '\n', encoding='utf-8')
          PY
            {
              echo "::group::Mistral Vibe runtime stderr (scrubbed, last 20 lines)"
              cat /tmp/onecompany-mistral-error-scrubbed.txt
              echo "::endgroup::"
            }
          fi

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Post Mistral result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          READY: ${{ steps.preflight.outputs.ready }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outputs.status }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          TARGET_READY: ${{ steps.target.outputs.ready }}
          TARGET_STATUS: ${{ steps.target.outputs.status }}
          EVIDENCE_READY: ${{ steps.evidence.outputs.ready }}
          EVIDENCE_STATUS: ${{ steps.evidence.outputs.status }}
          STAGE_READY: ${{ steps.stage.outputs.ready }}
          STAGE_STATUS: ${{ steps.stage.outputs.status }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          ACTOR_EXIT: ${{ steps.actor.outputs.exit_code }}
          ACTOR_STATUS: ${{ steps.actor.outputs.status }}
          ACTOR_REASON: ${{ steps.actor.outputs.failure_reason }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${READY:-false}" == "true" && "${ACTOR_EXIT:-1}" == "0" ]]; then
            # Defense in depth: even though Vibe has no shell/write tool, scrub the
            # literal provider credential plus common authorization/key renderings
            # before any model-authored text can reach a public issue comment.
            python -I - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('/tmp/onecompany-mistral-output.txt')
          target = Path('/tmp/onecompany-mistral-public.txt')
          text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
          secret = os.environ.get('MISTRAL_API_KEY', '')
          if secret:
              text = text.replace(secret, '[REDACTED]')
          text = re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)(MISTRAL_API_KEY\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
          target.write_text(text[:50000], encoding='utf-8')
          PY
          fi

          {
            echo "**mistral-vibe cloud exact-head ADVISORY review (non-binding)**"
            echo "PR #${REVIEW_PR:-not-admitted}; exact head ${REVIEW_SHA:-not-admitted}"
            echo
            if [[ "${TARGET_READY:-false}" != "true" ]]; then
              echo "${TARGET_STATUS:-REVIEW_TARGET_BLOCKED} - no valid exact-head review assignment; no model call."
            elif [[ "${EVIDENCE_READY:-false}" != "true" ]]; then
              echo "${EVIDENCE_STATUS:-REVIEW_EVIDENCE_BLOCKED} - PR head/CI/diff validation failed; no model call."
            elif [[ "${STAGE_READY:-false}" != "true" ]]; then
              echo "${STAGE_STATUS:-REVIEW_STAGE_BLOCKED} - isolated source stage failed; no model call."
            elif [[ "${READY:-false}" != "true" ]]; then
              echo "${PREFLIGHT_STATUS:-PREFLIGHT_FAILED} - ${PREFLIGHT_REASON:-preflight failed}. No paid fallback was attempted."
            elif [[ "${ACTOR_EXIT:-1}" != "0" ]]; then
              echo "${ACTOR_STATUS:-EXECUTION_FAILED} - ${ACTOR_REASON:-Mistral Vibe exited without a usable result}. PAYG remains disabled and no paid fallback was attempted."
            else
              echo '```text'
              cat /tmp/onecompany-mistral-public.txt
              echo
              echo '```'
            fi
          } > /tmp/onecompany-mistral-comment.md
          gh issue comment 130 --repo "$GITHUB_REPOSITORY" --body-file /tmp/onecompany-mistral-comment.md

      # Review publication is performed by the trusted parent, NEVER the
      # model. The provider has read-only tools and no GitHub write token.
      # The resulting GitHub review remains ADVISORY until actor-provenance
      # and nonauthor publisher qualification are separately demonstrated.
      - name: Publish current-head Mistral advisory PR review as Actions bot
        if: steps.preflight.outputs.ready == 'true' && steps.actor.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_BASE: ${{ steps.target.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          # Pin source policy to pre-candidate protected-main copy.
          python -I - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "/tmp")
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "trusted_mistral_review", "/tmp/onecompany-mistral-review-trusted.py"
          )
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          number = int(os.environ["REVIEW_PR"])
          head, base = os.environ["REVIEW_SHA"], os.environ["REVIEW_BASE"]
          guard.current_pr(number, head, base)
          if not guard.independent_material_authors(number, head):
              raise SystemExit("MISTRAL_REVIEW_AUTHORSHIP_BLOCKED")
          if not guard.latest_ci_green(number, head):
              raise SystemExit("MISTRAL_REVIEW_STALE_CI")
          result = Path("/tmp/onecompany-mistral-public.txt")
          if not result.is_file():
              raise SystemExit("MISTRAL_REVIEW_RESULT_MISSING")
          parser_spec = importlib.util.spec_from_file_location(
              "trusted_mistral_result", "/tmp/onecompany-mistral-result-trusted.py"
          )
          parser = importlib.util.module_from_spec(parser_spec)
          parser_spec.loader.exec_module(parser)
          value = parser.parse_result(
              result.read_bytes(), pr=number, head=head, base=base
          )
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          body = parser.format_comment(value, run_url=run_url)
          Path("/tmp/onecompany-mistral-pr-review.txt").write_text(
              body, encoding="utf-8"
          )
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$REVIEW_PR/reviews" \
            -f event=COMMENT \
            -f "commit_id=$REVIEW_SHA" \
            --raw-field "body=$(cat /tmp/onecompany-mistral-pr-review.txt)" \
            --jq '{review_id:.id, login:.user.login, commit_id:.commit_id, state:.state}'

 \
              --max-turns 2 \
              --max-tokens 64000 \
              --output text \
              --prompt "$(cat /tmp/onecompany-mistral-prompt.txt)" \
              > /tmp/onecompany-mistral-output.txt \
              2> /tmp/onecompany-mistral-error.txt
          code=$?
          set -e

          status="OK"
          reason="ready"
          if [[ "$code" == "0" ]] && ! grep -Eq '[^[:space:]]' /tmp/onecompany-mistral-output.txt; then
            code=70
            status="EXECUTION_FAILED"
            reason="Mistral Vibe returned an empty final answer from the isolated review stage"
          elif [[ "$code" == "0" ]] && grep -Eqi '^[[:space:]]*INSUFFICIENT_EVIDENCE[[:space:]]*$' /tmp/onecompany-mistral-output.txt; then
            code=71
            status="INSUFFICIENT_EVIDENCE"
            reason="Mistral explicitly reported insufficient evidence; not a completed advisory review"
          elif [[ "$code" == "0" ]]; then
            # A nonempty model answer is NOT proof of a completed review.
            # Validate strict UTF-8 JSON and detect INSUFFICIENT_EVIDENCE
            # while the raw result is still local and before publication.
            set +e
            python -I /tmp/onecompany-mistral-result-trusted.py \
              "$REVIEW_PR" "$REVIEW_SHA" "$REVIEW_BASE" \
              /tmp/onecompany-mistral-output.txt
            parsed_code=$?
            set -e
            if [[ "$parsed_code" == "71" ]]; then
              code=71
              status="INSUFFICIENT_EVIDENCE"
              reason="Mistral returned a valid JSON insufficient-evidence verdict"
            elif [[ "$parsed_code" != "0" ]]; then
              code=72
              status="RESULT_CONTRACT_INVALID"
              reason="Mistral review is malformed, stale, overbound or not schema-valid"
            fi
          elif [[ "$code" == "124" || "$code" == "137" ]]; then
            status="WAKE_TIMEOUT"
            reason="Mistral Vibe exceeded the 10-minute actor time limit"
          elif [[ "$code" != "0" ]]; then
            if grep -Eqi '<vibe_stop_event>Turn limit of [0-9]+ reached</vibe_stop_event>' /tmp/onecompany-mistral-error.txt; then
              status="TURN_LIMIT_EXCEEDED"
              reason="Mistral Vibe exhausted bounded agent turns without a usable review; no approval evidence"
            elif grep -Eqi '401|unauthori[sz]ed|invalid[^[:alnum:]]*(api[^[:alnum:]]*)?key|authentication' /tmp/onecompany-mistral-error.txt; then
              status="AUTH_BLOCKED"
              reason="Mistral credential was rejected by the Vibe runtime"
            elif grep -Eqi '403|forbidden|entitlement|permission denied' /tmp/onecompany-mistral-error.txt; then
              status="ENTITLEMENT_BLOCKED"
              reason="Mistral Vibe entitlement was rejected by the runtime"
            elif grep -Eqi 'token limit exceeded|context (window|length) exceeded|too many tokens' /tmp/onecompany-mistral-error.txt; then
              status="TOKEN_BUDGET_EXCEEDED"
              reason="Mistral Vibe hit this workflow's configured per-execution token ceiling; NOT proof of exhausted subscription credits, included quota or financial budget; narrow evidence before retry"
            elif grep -Eqi '429|rate.?limit|quota|usage[^[:alnum:]]*limit|capacity' /tmp/onecompany-mistral-error.txt; then
              status="CAPACITY_DEGRADED"
              reason="Mistral included capacity is unavailable or exhausted"
            elif grep -Eqi 'trust|trusted folder|workspace' /tmp/onecompany-mistral-error.txt; then
              status="WORKSPACE_TRUST_FAILED"
              reason="Mistral Vibe workspace trust initialization failed"
            elif grep -Eqi 'no such option|unknown option|unrecognized|usage:' /tmp/onecompany-mistral-error.txt; then
              status="CLI_INCOMPATIBLE"
              reason="Mistral Vibe CLI invocation is incompatible with the pinned version"
            else
              status="EXECUTION_FAILED"
              reason="Mistral Vibe runtime failed with an unclassified nonzero exit"
            fi
          fi

          if [[ "$code" != "0" ]] && [[ -s /tmp/onecompany-mistral-error.txt ]]; then
            # Job-log-only diagnostics. Scrub the literal credential plus common
            # bearer/key renderings before the excerpt can reach the Actions log;
            # it is never posted to the public issue comment.
            python -I - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('/tmp/onecompany-mistral-error.txt')
          target = Path('/tmp/onecompany-mistral-error-scrubbed.txt')
          text = source.read_text(encoding='utf-8', errors='replace')
          secret = os.environ.get('MISTRAL_API_KEY', '')
          if secret:
              text = text.replace(secret, '[REDACTED]')
          text = re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)(mistral_api_key\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
          lines = text.splitlines()
          target.write_text('\n'.join(lines[-20:]) + '\n', encoding='utf-8')
          PY
            {
              echo "::group::Mistral Vibe runtime stderr (scrubbed, last 20 lines)"
              cat /tmp/onecompany-mistral-error-scrubbed.txt
              echo "::endgroup::"
            }
          fi

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Post Mistral result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          READY: ${{ steps.preflight.outputs.ready }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outputs.status }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          TARGET_READY: ${{ steps.target.outputs.ready }}
          TARGET_STATUS: ${{ steps.target.outputs.status }}
          EVIDENCE_READY: ${{ steps.evidence.outputs.ready }}
          EVIDENCE_STATUS: ${{ steps.evidence.outputs.status }}
          STAGE_READY: ${{ steps.stage.outputs.ready }}
          STAGE_STATUS: ${{ steps.stage.outputs.status }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          ACTOR_EXIT: ${{ steps.actor.outputs.exit_code }}
          ACTOR_STATUS: ${{ steps.actor.outputs.status }}
          ACTOR_REASON: ${{ steps.actor.outputs.failure_reason }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${READY:-false}" == "true" && "${ACTOR_EXIT:-1}" == "0" ]]; then
            # Defense in depth: even though Vibe has no shell/write tool, scrub the
            # literal provider credential plus common authorization/key renderings
            # before any model-authored text can reach a public issue comment.
            python -I - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('/tmp/onecompany-mistral-output.txt')
          target = Path('/tmp/onecompany-mistral-public.txt')
          text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
          secret = os.environ.get('MISTRAL_API_KEY', '')
          if secret:
              text = text.replace(secret, '[REDACTED]')
          text = re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)(MISTRAL_API_KEY\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
          target.write_text(text[:50000], encoding='utf-8')
          PY
          fi

          {
            echo "**mistral-vibe cloud exact-head ADVISORY review (non-binding)**"
            echo "PR #${REVIEW_PR:-not-admitted}; exact head ${REVIEW_SHA:-not-admitted}"
            echo
            if [[ "${TARGET_READY:-false}" != "true" ]]; then
              echo "${TARGET_STATUS:-REVIEW_TARGET_BLOCKED} - no valid exact-head review assignment; no model call."
            elif [[ "${EVIDENCE_READY:-false}" != "true" ]]; then
              echo "${EVIDENCE_STATUS:-REVIEW_EVIDENCE_BLOCKED} - PR head/CI/diff validation failed; no model call."
            elif [[ "${STAGE_READY:-false}" != "true" ]]; then
              echo "${STAGE_STATUS:-REVIEW_STAGE_BLOCKED} - isolated source stage failed; no model call."
            elif [[ "${READY:-false}" != "true" ]]; then
              echo "${PREFLIGHT_STATUS:-PREFLIGHT_FAILED} - ${PREFLIGHT_REASON:-preflight failed}. No paid fallback was attempted."
            elif [[ "${ACTOR_EXIT:-1}" != "0" ]]; then
              echo "${ACTOR_STATUS:-EXECUTION_FAILED} - ${ACTOR_REASON:-Mistral Vibe exited without a usable result}. PAYG remains disabled and no paid fallback was attempted."
            else
              echo '```text'
              cat /tmp/onecompany-mistral-public.txt
              echo
              echo '```'
            fi
          } > /tmp/onecompany-mistral-comment.md
          gh issue comment 130 --repo "$GITHUB_REPOSITORY" --body-file /tmp/onecompany-mistral-comment.md

      # Review publication is performed by the trusted parent, NEVER the
      # model. The provider has read-only tools and no GitHub write token.
      # The resulting GitHub review remains ADVISORY until actor-provenance
      # and nonauthor publisher qualification are separately demonstrated.
      - name: Publish current-head Mistral advisory PR review as Actions bot
        if: steps.preflight.outputs.ready == 'true' && steps.actor.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_BASE: ${{ steps.target.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          # Pin source policy to pre-candidate protected-main copy.
          python -I - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "/tmp")
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "trusted_mistral_review", "/tmp/onecompany-mistral-review-trusted.py"
          )
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          number = int(os.environ["REVIEW_PR"])
          head, base = os.environ["REVIEW_SHA"], os.environ["REVIEW_BASE"]
          guard.current_pr(number, head, base)
          if not guard.independent_material_authors(number, head):
              raise SystemExit("MISTRAL_REVIEW_AUTHORSHIP_BLOCKED")
          if not guard.latest_ci_green(number, head):
              raise SystemExit("MISTRAL_REVIEW_STALE_CI")
          result = Path("/tmp/onecompany-mistral-public.txt")
          if not result.is_file():
              raise SystemExit("MISTRAL_REVIEW_RESULT_MISSING")
          parser_spec = importlib.util.spec_from_file_location(
              "trusted_mistral_result", "/tmp/onecompany-mistral-result-trusted.py"
          )
          parser = importlib.util.module_from_spec(parser_spec)
          parser_spec.loader.exec_module(parser)
          value = parser.parse_result(
              result.read_bytes(), pr=number, head=head, base=base
          )
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          body = parser.format_comment(value, run_url=run_url)
          Path("/tmp/onecompany-mistral-pr-review.txt").write_text(
              body, encoding="utf-8"
          )
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$REVIEW_PR/reviews" \
            -f event=COMMENT \
            -f "commit_id=$REVIEW_SHA" \
            --raw-field "body=$(cat /tmp/onecompany-mistral-pr-review.txt)" \
            --jq '{review_id:.id, login:.user.login, commit_id:.commit_id, state:.state}'

