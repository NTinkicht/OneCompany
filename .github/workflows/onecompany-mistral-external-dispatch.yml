name: OneCompany L4 External Review Auto Dispatch

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: onecompany-l4-external-review-auto-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable trusted main control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted scheduled source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Discover and publish bounded exact-head review sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/mistral_external_dispatch.py prepare

      - name: Upload run-scoped dispatcher source proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onecompany-external-dispatch-proof
          path: /tmp/onecompany-external-dispatch-proof.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Dispatch only after source proof is durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/mistral_external_dispatch.py handoff
