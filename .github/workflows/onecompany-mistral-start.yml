# Owner-authorized pre-lease branch/PR preparation, NOT model-authored code.
name: OneCompany Mistral Canonical PR Start

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  mistral-start:
    if: >-
      github.event.issue.number == 130 &&
      github.event.issue.pull_request == null &&
      github.actor == 'NTinkicht' &&
      contains(github.event.comment.body, 'MISTRAL_START_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: onecompany-mistral-canonical-intake
      cancel-in-progress: false
    steps:
      - name: Checkout protected main without stored GitHub token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Start exactly one safe draft PR for predeclared READY WU
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/mistral_cloud_start.py > /tmp/mistral-start-result.json; then
            echo "status=PR_PREPARED_NOT_MODEL_QUALIFIED" >> "$GITHUB_OUTPUT"
          else
            echo "status=START_BLOCKED_OR_RECONCILE_REQUIRED" >> "$GITHUB_OUTPUT"
          fi

      - name: Report exact outcome to owner wake bus
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.start.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "**Mistral canonical PR intake:** ${STATE:-START_BLOCKED}"
            echo "Only a predeclared LOW/MEDIUM READY Work Unit may be started."
            echo "The draft PR scaffold is NOT Mistral-authored code or green model tests."
            echo "A protected WU-to-PR binding and a durable implementation lease are"
            echo "still required before the existing MISTRAL_WORK_V1 coder may run."
            if [[ "${STATE:-}" == "PR_PREPARED_NOT_MODEL_QUALIFIED" ]]; then
              cat /tmp/mistral-start-result.json
            fi
          } > /tmp/mistral-start-report.md
          gh issue comment 130 --repo "$GITHUB_REPOSITORY"             --body-file /tmp/mistral-start-report.md
