name: OneCompany Validate

on:
  pull_request:
    paths:
      - '.onecompany/**'
      - '.opencodereview/**'
      - 'agents/**'
      - 'company/**'
      - 'patterns/**'
      - 'overlays/**'
      - 'docs/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'examples/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'BOOTSTRAP.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'onecompany.py'
      - 'Makefile'
      - '.github/CODEOWNERS'
      - '.github/copilot-instructions.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/onecompany-validate.yml'
  push:
    branches: [main]
    paths:
      - '.onecompany/**'
      - '.opencodereview/**'
      - 'agents/**'
      - 'company/**'
      - 'patterns/**'
      - 'overlays/**'
      - 'docs/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - 'examples/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'BOOTSTRAP.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'onecompany.py'
      - 'Makefile'
      - '.github/CODEOWNERS'
      - '.github/copilot-instructions.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/onecompany-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 — immutable pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # actions/setup-python v7.0.0 — immutable pin.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate complete control plane, planning and assurance policy
        run: python onecompany.py validate
      - name: Validate reference high-risk assurance packet
        run: python onecompany.py assurance .onecompany/reference/assurance/WU900.json
      - name: Test unit and assurance invariants
        run: python -m unittest discover -s .onecompany/selftest -p 'test_*.py'
      - name: Simulate core policy invariants
        run: python onecompany.py simulate
      - name: Simulate durable-ledger races
        run: python onecompany.py simulate-ledger
      - name: Simulate conflict-aware parallel planning
        run: python onecompany.py simulate-parallel
      - name: Simulate 24/7 supervision invariants
        run: python onecompany.py simulate-supervision
      - name: Smoke-test fresh bootstrap
        run: python scripts/smoke_bootstrap.py
      - name: Smoke-test GitHub-template initialization
        run: python scripts/smoke_init.py
      - name: Compile Python helpers
        run: python -m compileall -q scripts .onecompany/selftest onecompany.py

      # Normal post-bootstrap rule: both the aggregation core (v2) and the
      # low-overhead runner (v3) are copied from the exact reviewed base. A
      # candidate cannot select or modify the program that measures itself.
      #
      # One tightly bounded recovery exists for the 0.4 -> 0.5 transition:
      # protected main at 17ccea8... contains trusted v2, but v2's per-opcode
      # coverage worker deterministically exceeds its 180s CI timeout. For that
      # exact base only, and only for the reviewed v3 blob below, the candidate
      # v3 runner may execute with the base-trusted v2 core. This recovery must
      # receive explicit human exact-head verification and independent review.
      # Once merged, every later base contains v3 and this branch is unreachable.
      - name: Produce base-trusted exact-head quality evidence
        id: trusted_quality
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RECOVERY_BASE_SHA: 17ccea8d5b252553d54de32accb1b4f922fe83ae
          RECOVERY_V3_BLOB: 46b51f3de9ff311bd938113ddd762a4aa833107c
        run: |
          set -euo pipefail
          mkdir -p .onecompany-evidence "$RUNNER_TEMP/onecompany-quality-trusted"
          TRUSTED_DIR="$RUNNER_TEMP/onecompany-quality-trusted"

          if ! git cat-file -e "$BASE_SHA:scripts/quality_evidence.py" 2>/dev/null; then
            echo "::error::Reviewed base is missing scripts/quality_evidence.py; post-bootstrap evidence cannot be produced."
            exit 2
          fi
          git show "$BASE_SHA:scripts/quality_evidence.py" > "$TRUSTED_DIR/quality_evidence_v2.py"

          if git cat-file -e "$BASE_SHA:scripts/quality_evidence_v3.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/quality_evidence_v3.py" > "$TRUSTED_DIR/quality_evidence_v3.py"
            echo "evidence_mode=base-trusted-v3" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_SHA" = "$RECOVERY_BASE_SHA" ]; then
            CANDIDATE_V3_BLOB=$(git rev-parse "$CANDIDATE_SHA:scripts/quality_evidence_v3.py" 2>/dev/null || true)
            if [ "$CANDIDATE_V3_BLOB" != "$RECOVERY_V3_BLOB" ]; then
              echo "::error::One-time quality-evidence recovery requires reviewed v3 blob $RECOVERY_V3_BLOB; got ${CANDIDATE_V3_BLOB:-missing}."
              exit 2
            fi
            git show "$CANDIDATE_SHA:scripts/quality_evidence_v3.py" > "$TRUSTED_DIR/quality_evidence_v3.py"
            echo "::warning::Using one-time base-SHA-bound v2->v3 quality-evidence recovery. Human exact-head verification is mandatory before promotion."
            echo "evidence_mode=one-time-v3-recovery" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Reviewed base is missing scripts/quality_evidence_v3.py; candidate-code fallback is forbidden."
            exit 2
          fi

          python "$TRUSTED_DIR/quality_evidence_v3.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --candidate-sha "$CANDIDATE_SHA" \
            --base-sha "$BASE_SHA" \
            --output .onecompany-evidence/quality.json \
            --max-mutants 30
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # actions/upload-artifact v7.0.1 — immutable pin.
      - name: Upload trusted quality evidence
        if: github.event_name == 'pull_request' && steps.trusted_quality.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onecompany-quality-evidence
          path: .onecompany-evidence/quality.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
