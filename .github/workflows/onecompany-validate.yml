name: OneCompany Validate

on:
  pull_request:
    paths:
      - '.onecompany/**'
      - 'company/**'
      - 'scripts/**'
      - '.github/workflows/onecompany-validate.yml'
  push:
    branches: [main]
    paths:
      - '.onecompany/**'
      - 'company/**'
      - 'scripts/**'
      - '.github/workflows/onecompany-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate control plane
        run: python scripts/validate.py
      - name: Simulate policy invariants
        run: python scripts/simulate.py
      - name: Compile Python helpers
        run: python -m compileall -q scripts
