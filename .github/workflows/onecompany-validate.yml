name: OneCompany Validate

on:
  pull_request:
    paths:
      - '.onecompany/**'
      - 'company/**'
      - 'patterns/**'
      - 'overlays/**'
      - 'scripts/**'
      - 'onecompany.py'
      - 'Makefile'
      - '.github/workflows/onecompany-validate.yml'
  push:
    branches: [main]
    paths:
      - '.onecompany/**'
      - 'company/**'
      - 'patterns/**'
      - 'overlays/**'
      - 'scripts/**'
      - 'onecompany.py'
      - 'Makefile'
      - '.github/workflows/onecompany-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate complete control plane
        run: python onecompany.py validate
      - name: Simulate core policy invariants
        run: python onecompany.py simulate
      - name: Simulate 24/7 supervision invariants
        run: python onecompany.py simulate-supervision
      - name: Compile Python helpers
        run: python -m compileall -q scripts
